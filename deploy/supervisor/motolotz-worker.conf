[program:motolotz-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /opt/motolotz/current/artisan queue:work --sleep=3 --tries=3 --timeout=90
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/motolotz-worker.log
