server {
    listen 80;
    listen [::]:80;
    server_name motolotz.com www.motolotz.com;
    return 301 https://motolotz.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.motolotz.com;
    return 301 https://motolotz.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name motolotz.com;

    root /opt/motolotz/current/public;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/motolotz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/motolotz.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }

    location ~ /\. {
        deny all;
    }
}
