services:
  app:
    image: "${IMAGE_NAME:?IMAGE_NAME is required}@${IMAGE_DIGEST:?IMAGE_DIGEST is required}"
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      SEED_DEVELOPMENT_DATA: "${SEED_DEVELOPMENT_DATA:-false}"
      DEVELOPMENT_SEED_PASSWORD: "${DEVELOPMENT_SEED_PASSWORD:-}"
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  scheduler:
    image: "${IMAGE_NAME:?IMAGE_NAME is required}@${IMAGE_DIGEST:?IMAGE_DIGEST is required}"
    command: php artisan schedule:work
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      SEED_DEVELOPMENT_DATA: "${SEED_DEVELOPMENT_DATA:-false}"
      DEVELOPMENT_SEED_PASSWORD: "${DEVELOPMENT_SEED_PASSWORD:-}"
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  app-storage:
  mysql-data:
