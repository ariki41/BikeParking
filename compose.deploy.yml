services:
  alloy:
    image: grafana/alloy:v1.10.1
    command: run --server.http.listen-addr=127.0.0.1:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - "./deploy/alloy/config.alloy:/etc/alloy/config.alloy:ro"
      - "app-storage:/var/www/html/storage:ro"
      - "/var/log/nginx:/var/log/nginx:ro"
      - "alloy-data:/var/lib/alloy/data"
    restart: unless-stopped
  app:
    image: "${IMAGE_NAME:?}@${IMAGE_DIGEST:?}"
    env_file: [.env]
    environment: { APP_ENV: production, APP_DEBUG: "false" }
    ports: ["127.0.0.1:8000:80"]
    volumes: ["app-storage:/var/www/html/storage"]
    depends_on: { mysql: { condition: service_healthy } }
    healthcheck: { test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/up || exit 1"], interval: 10s, timeout: 5s, retries: 12 }
    restart: unless-stopped
  scheduler:
    image: "${IMAGE_NAME:?}@${IMAGE_DIGEST:?}"
    command: php artisan schedule:work
    env_file: [.env]
    volumes: ["app-storage:/var/www/html/storage"]
    depends_on: { mysql: { condition: service_healthy } }
    restart: unless-stopped
  worker:
    image: "${IMAGE_NAME:?}@${IMAGE_DIGEST:?}"
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    env_file: [.env]
    volumes: ["app-storage:/var/www/html/storage"]
    depends_on: { mysql: { condition: service_healthy } }
    restart: unless-stopped
  mysql:
    image: mysql:8.4
    env_file: [.env]
    environment:
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck: { test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$$MYSQL_ROOT_PASSWORD\" --silent"], interval: 10s, timeout: 5s, retries: 12 }
    restart: unless-stopped
volumes: { app-storage: {}, alloy-data: {}, mysql-data: {} }
