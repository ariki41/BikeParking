services:
  app:
    image: "${IMAGE_NAME:?IMAGE_NAME is required}@${IMAGE_DIGEST:?IMAGE_DIGEST is required}"
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8000/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: &json-file-logging
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  scheduler:
    image: "${IMAGE_NAME:?IMAGE_NAME is required}@${IMAGE_DIGEST:?IMAGE_DIGEST is required}"
    command: php artisan schedule:work
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    logging: *json-file-logging
    restart: unless-stopped

  worker:
    image: "${IMAGE_NAME:?IMAGE_NAME is required}@${IMAGE_DIGEST:?IMAGE_DIGEST is required}"
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    logging: *json-file-logging
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *json-file-logging
    restart: unless-stopped

volumes:
  app-storage:
  mysql-data:
