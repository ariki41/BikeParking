services:
  app:
    image: "${IMAGE_NAME:?IMAGE_NAME is required}@${IMAGE_DIGEST:?IMAGE_DIGEST is required}"
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: &json-file-logging
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    env_file:
      - .env
    environment:
      APP_DOMAIN: "${APP_DOMAIN:?APP_DOMAIN is required}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot-webroot:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate --header=\"Host: $$APP_DOMAIN\" -q -O /dev/null https://127.0.0.1/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *json-file-logging
    restart: unless-stopped

  certbot:
    image: certbot/certbot:v3.1.0
    env_file:
      - .env
    environment:
      APP_DOMAIN: "${APP_DOMAIN:?APP_DOMAIN is required}"
      LETSENCRYPT_EMAIL: "${LETSENCRYPT_EMAIL:?LETSENCRYPT_EMAIL is required}"
    ports:
      - "80:80"
    volumes:
      - certbot-webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    profiles:
      - certbot

  scheduler:
    image: "${IMAGE_NAME:?IMAGE_NAME is required}@${IMAGE_DIGEST:?IMAGE_DIGEST is required}"
    command: php artisan schedule:work
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    logging: *json-file-logging
    restart: unless-stopped

  worker:
    image: "${IMAGE_NAME:?IMAGE_NAME is required}@${IMAGE_DIGEST:?IMAGE_DIGEST is required}"
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    logging: *json-file-logging
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *json-file-logging
    restart: unless-stopped

volumes:
  app-storage:
  mysql-data:
  certbot-webroot:
  letsencrypt:
