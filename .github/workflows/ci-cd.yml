name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_development:
        description: '開発環境へデプロイする'
        required: true
        default: false
        type: boolean

jobs:
  test:
    name: Test and asset build
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: testing
          MYSQL_USER: sail
          MYSQL_PASSWORD: password
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, gd, intl, mbstring, pdo_mysql, zip
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare Laravel test environment
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: sail
          DB_PASSWORD: password
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan migrate --force

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run test suite
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: sail
          DB_PASSWORD: password
          YOLP_URL: https://example.test/local-search
          YOLP_GEOCODE_URL: https://example.test/geocode
          YOLP_CLIENT_ID: test-client-id
        run: php artisan test

  image:
    name: Build production image
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}

    env:
      IMAGE_NAME: ghcr.io/ariki41/bikeparking

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish production image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-development:
    name: Deploy development server
    needs: image
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_development == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: development
    concurrency:
      group: deployment-development
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}
      IMAGE_DIGEST: ${{ needs.image.outputs.image_digest }}
      SEED_DEVELOPMENT_DATA: 'true'

    steps:
      - name: Check out deployment files
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Confirm deployment server is ready
        run: |
          if ! preflight_output="$(ssh \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sh -s -- '$DEPLOY_PATH'" <<'REMOTE_PREFLIGHT'
          set -eu

          deploy_path="$1"
          architecture="$(uname -m)"

          if [ "$architecture" != x86_64 ]; then
            echo "Unsupported architecture: $architecture (expected x86_64)." >&2
            exit 1
          fi

          if ! docker info >/dev/null; then
            echo 'Docker is not running or is not accessible to the deployment user.' >&2
            exit 1
          fi

          if ! docker compose version >/dev/null; then
            echo 'Docker Compose v2 is not available.' >&2
            exit 1
          fi

          if [ ! -d "$deploy_path" ] || [ ! -w "$deploy_path" ]; then
            echo "Deployment directory is missing or not writable: $deploy_path" >&2
            exit 1
          fi

          available_kib="$(df -Pk "$deploy_path" | awk 'NR == 2 { print $4 }')"
          if [ "$available_kib" -lt 5242880 ]; then
            echo "Insufficient disk space: ${available_kib}KiB available (5GiB required)." >&2
            exit 1
          fi
          REMOTE_PREFLIGHT
          )"; then
            {
              echo '## Deployment aborted'
              echo
              echo "The development server is unreachable or not ready: \`$DEPLOY_HOST\`."
              echo
              echo '```text'
              echo "$preflight_output"
              echo '```'
              echo 'No files or containers were changed.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload deployment definition
        run: |
          ssh \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH/docker/tailscale'"
          scp \
            -p \
            -P "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            compose.deploy.yml deploy.env.example scripts/deploy.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          scp \
            -P "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            docker/tailscale/funnel.json \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker/tailscale/"

      - name: Deploy immutable image
        env:
          DEVELOPMENT_SEED_PASSWORD: ${{ secrets.DEVELOPMENT_SEED_PASSWORD }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          if [ -z "$TS_AUTHKEY" ]; then
            echo 'The development Environment secret TS_AUTHKEY is required.' >&2
            exit 1
          fi

          auth_key_file="$(mktemp)"
          trap 'rm -f "$auth_key_file"' EXIT
          chmod 600 "$auth_key_file"
          printf '%s\n' "$TS_AUTHKEY" > "$auth_key_file"

          scp \
            -P "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$auth_key_file" \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.tailscale-authkey-$GITHUB_RUN_ID"

          ssh \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sh -s -- '$DEPLOY_PATH' '$GITHUB_RUN_ID'" <<'REMOTE_AUTHKEY'
          set -eu

          deploy_path="$1"
          run_id="$2"
          env_path="$deploy_path/.env"
          auth_key_path="$deploy_path/.tailscale-authkey-$run_id"
          temp_env=''

          cleanup() {
            rm -f "$auth_key_path"
            if [ -n "$temp_env" ]; then
              rm -f "$temp_env"
            fi
          }
          trap cleanup EXIT

          if [ ! -f "$env_path" ]; then
            echo "Missing $env_path." >&2
            exit 1
          fi

          chmod 600 "$auth_key_path"
          auth_key="$(cat "$auth_key_path")"
          if [ -z "$auth_key" ]; then
            echo 'The uploaded Tailscale auth key is empty.' >&2
            exit 1
          fi

          umask 077
          temp_env="$(mktemp "$deploy_path/.env.XXXXXX")"
          found_auth_key=0

          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              TS_AUTHKEY=*)
                printf 'TS_AUTHKEY=%s\n' "$auth_key" >> "$temp_env"
                found_auth_key=1
                ;;
              *)
                printf '%s\n' "$line" >> "$temp_env"
                ;;
            esac
          done < "$env_path"

          if [ "$found_auth_key" -eq 0 ]; then
            printf '\nTS_AUTHKEY=%s\n' "$auth_key" >> "$temp_env"
          fi

          mv "$temp_env" "$env_path"
          temp_env=''
          REMOTE_AUTHKEY

          ssh \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "env IMAGE_NAME='$IMAGE_NAME' IMAGE_DIGEST='$IMAGE_DIGEST' SEED_DEVELOPMENT_DATA='$SEED_DEVELOPMENT_DATA' DEVELOPMENT_SEED_PASSWORD='$DEVELOPMENT_SEED_PASSWORD' bash '$DEPLOY_PATH/deploy.sh' '$DEPLOY_PATH'"

      - name: Publish deployment details
        run: |
          {
            echo '## Development deployment'
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo "Image: \`${IMAGE_NAME}@${IMAGE_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
