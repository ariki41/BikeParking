name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: '本番環境へデプロイする'
        required: true
        default: false
        type: boolean

jobs:
  test:
    name: Quality checks, tests, and asset build
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: testing
          MYSQL_USER: sail
          MYSQL_PASSWORD: password
          MYSQL_ROOT_PASSWORD: password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, gd, intl, mbstring, pdo_mysql, zip
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci
          npm audit --audit-level=low
          npm run build
      - name: Prepare Laravel test environment
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: testing
          DB_USERNAME: sail
          DB_PASSWORD: password
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan migrate --force
      - run: vendor/bin/pint --test
      - run: composer analyse
      - name: Run test suite
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: testing
          DB_USERNAME: sail
          DB_PASSWORD: password
          YOLP_URL: https://example.test/local-search
          YOLP_GEOCODE_URL: https://example.test/geocode
          YOLP_CLIENT_ID: test-client-id
        run: php artisan test
      - name: Install and run browser tests
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: testing
          DB_USERNAME: sail
          DB_PASSWORD: password
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
          YOLP_URL: http://127.0.0.1:8081/local-search
          YOLP_GEOCODE_URL: http://127.0.0.1:8081/geocode
          YOLP_CLIENT_ID: test-client-id
        run: |
          npx playwright install --with-deps chromium
          php artisan migrate:fresh --force
          php artisan db:seed --class=BrowserE2ETestSeeder --force
          node tests/E2E/yolp-stub.js > storage/logs/e2e-yolp.log 2>&1 &
          php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/e2e-server.log 2>&1 &
          npm run test:e2e

  image:
    name: Build production image
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    env:
      IMAGE_NAME: ghcr.io/ariki41/bikeparking
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

  deploy-production:
    name: Deploy production server
    needs: image
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    concurrency: { group: deployment-production, cancel-in-progress: false }
    permissions: { contents: read }
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      IMAGE_NAME: ghcr.io/ariki41/bikeparking
      IMAGE_DIGEST: ${{ needs.image.outputs.image_digest }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Validate production server
        run: |
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sh -s -- '$DEPLOY_PATH'" <<'REMOTE'
          set -eu
          test -d "$1" && test -w "$1"
          docker info >/dev/null
          docker compose version >/dev/null
          REMOTE
      - name: Upload and activate image
        run: |
          scp -P "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes compose.deploy.yml deploy.env.example scripts/deploy.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "env IMAGE_NAME='$IMAGE_NAME' IMAGE_DIGEST='$IMAGE_DIGEST' bash '$DEPLOY_PATH/scripts/deploy.sh' '$DEPLOY_PATH'"
